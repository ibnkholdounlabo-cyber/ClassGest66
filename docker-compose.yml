version: '3.8'

services:
  app:
    build: .
    container_name: ecole-portail-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Montage du dossier data local pour conserver les données (élèves, notes, QCM, présences)
      - ./data:/app/data
